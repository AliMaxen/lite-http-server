# Listener
lite-server-host=127.0.0.1
lite-server-port=8080
listen-backlog=128

# Concurrency
max-workers=8
max-queue=128

# Request limits
max-headers=64
max-header-size=16384
max-chunk-line-size=128
max-trailer-size=65536
max-body-size=16777216
max-request-size=0
request-timeout=15
recv-buffer-size=0
send-buffer-size=0

# Server mode
reverse-proxy=0
document-root=./www
directory-serve=1
directory-listing=0

# Upstream (used when reverse-proxy=1)
proxy-host=127.0.0.1
proxy-port=8081

# Logging
allow-logging=1
logging-path=liteserver.log
